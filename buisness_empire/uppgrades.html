<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Empire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Business Empire</h1>

        <div class="headertext">
            <div class="money">
                <img src="circle-euro.svg" alt="">
                <div class="stattext">
                    <span class="moneydisplay"></span>
                    <p class="moneytot">Total cash</p>
                </div>
            </div>

            <div class="value">
                <img src="factory.svg" alt="">
                <div class="stattext">
                    <span class="valuedisplay"></span>
                    <p class="valuetot">Total value</p>
                </div>
            </div>

            <div class="reset">
                <img src="reset.svg" alt="">
                <div class="stattext">
                    <span class="resetdisplay"></span>
                    <p class="resettot">Resets</p>
                </div>
            </div>

        </div>
    </header>

    <div class="container">
        <div class="sidebar">
            
                <a href="index.html" class="dashboard">
                    <img src="layout-dashboard .svg" alt="">
                    <p>Dashboard</p>
                </a>

                <a href="businesses.html" class="businesses">
                    <img src="building-complex.svg" alt="">
                    <p>businesses</p>
                </a>

                <a href="uppgrades.html" class="uppgrades active">
                    <img src="circle-fading-arrow-up.svg" alt="">
                    <p>Uppgrades</p>
                </a>

                <a href="economy.html" class="economy">
                    <img src="circle-euro (white).svg" alt="">
                    <p>Economy</p>
                </a>

                <a href="settings.html" class="settings">
                    <img src="settings.svg" alt="">
                    <p>Settings</p>
                </a>

            </div>

            <div class="uppgradescontent">
                <h3>Uppgrades</h3>

                    <div class="uppgrades-grid">

                        <div class="uppgradecard">
                            <button class="info" id="incomeinfo">?</button>
                            <h2>Income Rate</h2>
                            <img src="money.png" alt="">
                            <button class="uppgradebtn" id="incomeratebtn" 
                            data-uppgrade="Income Rate"
                            data-text="Increase the income generated by all your businesses. Every company will generate more money with each payment. (+10%)"
                            ></button>
                        </div>

                        <div class="uppgradecard">
                            <button class="info" id="fatserinfo">?</button>
                            <h2>Faster Payments</h2>
                            <img src="fastmoney.png" alt="">
                            <button class="uppgradebtn" id="fasterpaymentsbtn" 
                            data-uppgrade="Faster Payments"
                            data-text="Reduce the time between payments, allowing your businesses to generate money more frequently. (-15s)"
                            ></button>
                        </div>

                        <div class="uppgradecard">
                            <button class="info" id="fasterinfo2">?</button>
                            <h2>Faster Payments 2</h2>
                            <img src="fastmoney.png" alt="">
                            <button class="uppgradebtn" id="fasterpayments2btn"
                            data-uppgrade="Faster Payments 2"
                            data-text="Upgrade your payment system even further and make your businesses generate money at a much faster rate. (-15s)"
                            ></button>
                        </div>

                        <div class="uppgradecard">
                            <button class="info" id="marketinginfo">?</button>
                            <h2>Marketing Campaign</h2> 
                            <img src="marketing.png" alt="">                       
                            <button class="uppgradebtn" id="marketingcampaignbtn"
                            data-uppgrade="Marketing Campaign"
                            data-text="Launch powerful marketing campaigns to attract more customers and increase the income generated by your businesses. (+10%)"
                            ></button>
                        </div>
                        
                        <div class="uppgradecard">
                            <button class="info" id="expansioninfo">?</button>
                            <h2>Business Expansion</h2>
                            <img src="expansion.png" alt="">
                            <button class="uppgradebtn" id="businessexpansionbtn"
                            data-uppgrade="Business Expansion"
                            data-text="Expand your existing businesses to increase their overall value and improve your empire's growth potential. (+20%)"
                            ></button>
                        </div>

                        <div class="uppgradecard">
                            <button class="info" id="motivationinfo">?</button>
                            <h2>Employee Motivation</h2>
                            <img src="motivation.png" alt="">
                            <button class="uppgradebtn" id="employeemotivationbtn"
                            data-uppgrade="Employee Motivation"
                            data-text="Improve employee satisfaction and productivity, helping your businesses operate more efficiently and generate more income. (+15%)"
                            ></button>
                        </div>

                    </div>
            </div>

            <div class="uppgradesoverlay">
                <p title="exit" class="exit">✕</p>
                <div class="popup">
                    <h1 class="uppgradename"></h1>
                    <p class="about">About</p>
                    <p id="uppgradetext"></p>
                    <button id="uppgrade">Upgrade</button>
                </div>
            </div>
        </div>
    <script src="main.js" defer></script>
</body>
</html>
